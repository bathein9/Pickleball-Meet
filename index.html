<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bukit Batok Pickleball Poll</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <button id="login-btn">Login</button>
            <h1>Bukit Batok Pickleball Poll</h1>
            <p>Weekly poll for booking a court</p>
            <div id="location-container">
                <label for="location-input">Location/Address:</label>
                <input type="text" id="location-input" placeholder="Enter Location/Address">
            </div>
            <div id="date-range">
                <label for="start-date">Start Date:</label>
                <input type="date" id="start-date">
                <label for="end-date">End Date:</label>
                <input type="date" id="end-date">
            </div>
        </header>
        <main id="poll-container"></main>
    </div>

    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Login</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button id="login-submit">Login</button>
        </div>
    </div>

    <div id="attendee-modal" class="modal">
        <div class="modal-content">
            <span class="close-attendee-btn">&times;</span>
            <h2 id="attendee-modal-title">Add Attendee</h2>
            <input type="text" id="attendee-name" placeholder="Name">
            <input type="number" id="attendee-dupr" placeholder="DUPR Rating (e.g., 3.5)" step="0.1">
            <button id="add-attendee-submit">Add</button>
        </div>
    </div>

    <script src="main.js" type="module"></script>
    <div id="disqus_thread"></div>
